[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aquifer-api-client"
version = "0.1.0"
description = "Python client for the Aquifer Bible API"
readme = "README.md"
license = "MIT"
authors = ["BibleAquifer"]
keywords = ["bible", "aquifer", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Religion",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
packages = [{ include = "aquifer", from = "src" }]

[tool.poetry.urls]
Homepage = "https://github.com/BibleAquifer/aquifer-api-client"
Repository = "https://github.com/BibleAquifer/aquifer-api-client"
Issues = "https://github.com/BibleAquifer/aquifer-api-client/issues"

[tool.poetry.dependencies]
python = ">=3.11"
requests = ">=2.31"
urllib3 = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
responses = ">=0.25"
mypy = ">=1.8"
ruff = ">=0.3"
types-requests = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live API tests (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
